# Usage on Unraid:
#   ORIGIN=http://YOUR_UNRAID_IP:3000 docker compose -f docker-compose.yml -f docker-compose.unraid.yml up -d --build
#
# Or copy this file's volume/port settings into the Unraid Docker UI.

services:
  hourmark:
    ports:
      - "3000:3000"
    environment:
      ORIGIN: "${ORIGIN:?Set ORIGIN to http://YOUR_UNRAID_IP:3000}"
      TURSO_DATABASE_URL: "${TURSO_DATABASE_URL:-file:/data/hourmark.db}"
      TURSO_AUTH_TOKEN: "${TURSO_AUTH_TOKEN:-}"
    volumes:
      - /mnt/user/appdata/hourmark:/data
